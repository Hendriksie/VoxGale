name: Release

# Ship flow (Phase 4, design P4-D2): pushing a tag matching v* runs the
# analyze + test suite, builds the signed release APK, verifies its
# signature, and publishes a GitHub Release with the APK attached as
# voxgale-<tag>.apk. The signing key comes from repository secrets
# (see README.md, Release) and never enters the repository.
#
# Flutter and the Android SDK are installed directly from the official
# archives — no third-party Flutter action. (The previously used
# subosito/flutter-github-action repository disappeared and action
# references do not follow repo renames, which broke action resolution;
# first-party setup only from here on.)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Pin the Flutter version so release builds are reproducible; bumping it
  # is a one-line change.
  FLUTTER_VERSION: '3.47.8'
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned Flutter SDK from the official release archive.
      - name: Set up Flutter
        run: |
          curl -fsSL -o flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar -xf flutter.tar.xz
          echo "$PWD/flutter/bin" >> "$GITHUB_PATH"

      # The Android SDK the build runs against (compileSdk 36 / build-tools
      # 36.0.0; AGP auto-downloads the NDK flutter.ndkVersion pins).
      - name: Set up the Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Decode the release signing key
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::Repository secrets UPLOAD_KEYSTORE and KEY_PROPERTIES must be set (see README.md, Release)."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE" | base64 -d > android/app/upload-keystore.jks
          echo "$KEY_PROPERTIES" > android/key.properties

      - run: flutter build apk --release

      # The release artifact must verify against the release key before it
      # is published (release-distribution spec: no unsigned or debug-signed
      # release artifacts).
      - name: Verify the APK signature
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | tail -1)
          "$BT/apksigner" verify build/app/outputs/flutter-apk/app-release.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk "voxgale-${tag}.apk"
          gh release create "$tag" "voxgale-${tag}.apk" \
            --title "$tag" \
            --notes "VoxGale ${tag} — signed release APK for sideloading. See README.md for install instructions and PRIVACY.md for the privacy policy."
