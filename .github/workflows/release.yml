name: Release

# Ship flow (Phase 4, design P4-D2): pushing a tag matching v* runs the
# analyze + test suite, builds the signed release APK, verifies its
# signature, and publishes a GitHub Release with the APK attached as
# voxgale-<tag>.apk and notes taken from the matching CHANGELOG.md section.
# The signing key comes from repository secrets
# (see README.md, Release) and never enters the repository.
#
# Flutter and the Android SDK are installed directly from the official
# archives — no third-party Flutter action. (The previously used
# subosito/flutter-github-action repository disappeared and action
# references do not follow repo renames, which broke action resolution;
# first-party setup only from here on.)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Pin the Flutter version so release builds are reproducible; bumping it
  # is a one-line change.
  FLUTTER_VERSION: '3.47.8'
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  release:
    # Pinned (not ubuntu-latest): the label migrates to Ubuntu 26, and the
    # release build should not move under us.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Pinned Flutter SDK from the official release archive. Extracted to
      # $HOME — NOT into the workspace: `flutter analyze` walks the package
      # root, and an SDK extracted inside the checkout makes it analyze the
      # SDK's own sources (190k bogus errors; reproduced locally). The
      # tarball is deleted right after extraction — GitHub runners have
      # limited free disk and the build later ran out of space.
      - name: Set up Flutter
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flutter.tar.xz" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$HOME"
          rm -f "$RUNNER_TEMP/flutter.tar.xz"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      # The Android SDK the build runs against (compileSdk 36 / build-tools
      # 36.0.0; AGP auto-downloads the NDK flutter.ndkVersion pins — the NDK
      # is genuinely required: the jni plugin builds libdartjni.so into the
      # APK — plus CMake for it).
      - name: Set up the Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/cmdtools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$ANDROID_SDK_ROOT/cmdline-tools"
          rm -f "$RUNNER_TEMP/cmdtools.zip"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # Disk-space visibility: the release build once failed with
      # "No space left on device" during packaging on a runner with ~14 GB
      # free — Flutter SDK + Android SDK + NDK + Gradle caches + build
      # intermediates add up.
      - name: Report disk space
        run: df -h / "$HOME" "$ANDROID_SDK_ROOT"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Decode the release signing key
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::Repository secrets UPLOAD_KEYSTORE and KEY_PROPERTIES must be set (see README.md, Release)."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE" | base64 -d > android/app/upload-keystore.jks
          echo "$KEY_PROPERTIES" > android/key.properties

      - run: flutter build apk --release

      # The release artifact must verify against the release key before it
      # is published (release-distribution spec: no unsigned or debug-signed
      # release artifacts).
      - name: Verify the APK signature
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | tail -1)
          "$BT/apksigner" verify build/app/outputs/flutter-apk/app-release.apk

      # Release notes come from the matching CHANGELOG.md section
      # (## [<tag>]); the one-line default is the fallback for a tag that
      # has no section yet.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk "voxgale-${tag}.apk"
          notes="$(awk -v tag="$tag" '
            index($0, "## [" tag "]") == 1 { found = 1; next }
            /^## / { if (found) exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            notes="VoxGale ${tag} — signed release APK for sideloading. See README.md for install instructions and PRIVACY.md for the privacy policy."
          fi
          gh release create "$tag" "voxgale-${tag}.apk" \
            --title "$tag" \
            --notes "$notes"
