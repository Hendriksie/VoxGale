schema: spec-driven

context: |
  # VoxGale Transcription App (Android, Flutter)

  Live-capture + file-transcription app powered by the user's own Mistral API key.

  ## Stack & conventions
  - Flutter (Dart), Riverpod, Material 3 theming
  - Local storage: Drift (SQLite); API key: flutter_secure_storage only
  - Mic capture via `record` (PCM16 stream); background capture via Android
    foreground service with `microphone` type (`flutter_foreground_task`)
  - UI: minimalistic & modern, Mistral orange #FF7000 as accent in BOTH
    light and dark themes; orange used sparingly (recording state, CTAs)

  ## Hard constraints
  - ALL Mistral API code lives in lib/mistral/ behind abstract interfaces
    (realtime WebSocket + batch REST). Never call the API from UI or
    service code directly. Makes the API mockable and survives model-ID churn.
  - Realtime transcription: wss://api.mistral.ai/v1/audio/transcriptions/realtime
    (model voxtral-mini-transcribe-realtime-3-0), audio pcm_s16le @ 16 kHz mono
    sent as base64 input_audio.append chunks. All session settings go in one
    session.update before the first audio chunk (settings lock after that).
    A realtime session takes `diarize` XOR `turn_detection`, never both.
    v1 default: turn detection live + post-session batch pass (diarize=true)
    on saved audio for speaker attribution; live diarization is a per-session
    toggle. Batch: POST /v1/audio/transcriptions with models
    voxtral-mini-transcribe-3-0 / voxtral-small-transcribe-3-0;
    diarize=true requires timestamp_granularities=segment.
  - Never hardcode, log, or commit API keys. User-supplied key only, over TLS
    to api.mistral.ai.
  - WebSocket client must handle reconnect + local audio buffering.

  ## Working rules
  - Every change starts with /opsx:propose; never implement before the
    proposal exists. Keep most changes in Lite mode.
  - Validate with `openspec validate --strict` before claiming done.
  - Tests mock the Mistral WebSocket/REST layer (mocktail), never hit the
    live API in unit tests.
