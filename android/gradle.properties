# 4G heap: enough for this app's build, and it must fit a 7 GB GitHub
# Actions runner (8G would risk the OOM killer there).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# NOTE: org.gradle.java.home is machine-local and must NOT be committed —
# set it in the user-level ~/.gradle/gradle.properties (see README.md,
# Build from source). A clean checkout builds with any JDK 17 on JAVA_HOME.
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
